# The golden set calls the LLM ~13 times. Free-tier quotas are small per model per day,
# so this runs on demand (and after prompt/model/retrieval changes), not on every push.
name: eval

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Service URL (default: production)"
        required: false

permissions:
  contents: read

jobs:
  golden-set:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
      - run: uv sync --frozen --project backend
      - run: uv run --project backend python evals/run_evals.py --base-url "${BASE_URL}"
        env:
          BASE_URL: ${{ inputs.base_url || 'https://recipe-qa.vercel.app' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: evals/reports/
