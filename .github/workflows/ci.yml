name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual redeploy of main, e.g. after rotating GOOGLE_API_KEY or OPS_TOKEN.
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Redeploy even if this commit is already live"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.3"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Tests never call the network; a dummy key proves no real secret is needed.
      - run: uv run pytest
        env:
          GOOGLE_API_KEY: dummy

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT) from its official image, pinned by digest. The gitleaks GitHub
      # Action needs a paid license for organization-owned repositories.
      - name: scan full git history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --exit-code 1 /repo

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: recipe-qa:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Container smoke test without a real key: startup must survive a failing
      # embedding call (BM25 fallback), and the no-LLM paths must answer.
      - name: smoke test container
        run: |
          docker run -d --name app -p 7860:7860 -e GOOGLE_API_KEY=dummy recipe-qa:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/healthz && break; sleep 2; done
          curl -sf localhost:7860/healthz | grep -q '"corpus_size":52'
          curl -sf localhost:7860/ | grep -q "Recipe Q&amp;A"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:7860/ask -H 'content-type: application/json' -d '{"question":""}')
          test "$code" = 422
          curl -sf localhost:7860/ask -H 'content-type: application/json' \
            -d '{"question":"I ate peanuts and my throat is swelling"}' | grep -q '"refusal_reason":"safety"'
          docker exec app id -u | grep -qx 1000
      - if: always()
        run: docker logs app || true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend, secrets-scan, image]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Never run two deploys at once; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No secrets are in the environment of this step (npm install scripts run here).
      - name: build UI
        run: npm ci && npm run build
        working-directory: frontend
      - id: deploy
        name: deploy this commit to Vercel production
        run: python3 deploy/vercel.py deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPS_REVIEW_TOKEN: ${{ secrets.OPS_REVIEW_TOKEN }}
          OPS_REVIEW_TOKEN_EXPIRES_AT: ${{ vars.OPS_REVIEW_TOKEN_EXPIRES_AT }}
          FORCE_DEPLOY: ${{ inputs.force_deploy && '1' || '0' }}
      - name: smoke test the live service
        run: python3 deploy/vercel.py verify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
